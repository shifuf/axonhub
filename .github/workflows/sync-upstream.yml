name: Sync Upstream unstable

# Scheduled sync is intentionally disabled: GitHub disabled Actions on this
# repository and daily force-push automations on forks are a common
# abuse-detection trigger. Sync manually when needed via workflow_dispatch.
on:
  workflow_dispatch:

# The sync force-pushes the target branch, so it needs write access.
permissions:
  contents: write

jobs:
  sync:
    name: Mirror upstream unstable
    runs-on: ubuntu-latest
    # Safety guard: only run inside a fork, never on the upstream repository itself.
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Checkout unstable
        uses: actions/checkout@v4
        with:
          ref: unstable
          fetch-depth: 0
          persist-credentials: false

      - name: Sync upstream changes
        id: sync
        run: |
          set -euo pipefail

          git config user.name "axonhub-sync-bot"
          git config user.email "actions@users.noreply.github.com"

          UPSTREAM="https://github.com/looplj/axonhub.git"
          TARGET_BRANCH="unstable"

          git remote add upstream "$UPSTREAM"
          # Retry the fetch: transient GitHub-to-GitHub network hiccups were the
          # most common cause of the previous third-party action failing.
          for attempt in 1 2 3; do
            if git fetch upstream "${TARGET_BRANCH}" --tags --force; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::failed to fetch ${UPSTREAM} after 3 attempts"
              exit 1
            fi
            sleep 10
          done

          UPSTREAM_SHA="$(git rev-parse "upstream/${TARGET_BRANCH}")"
          LOCAL_SHA="$(git rev-parse HEAD)"
          echo "upstream=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "local=${LOCAL_SHA}" >> "$GITHUB_OUTPUT"

          if [ "$UPSTREAM_SHA" = "$LOCAL_SHA" ]; then
            echo "Already up to date at ${LOCAL_SHA}"
            exit 0
          fi

          # The fork's unstable branch is a pure mirror: fast-forward when possible,
          # otherwise reset to the upstream tip. Local-only commits on this branch
          # are intentionally discarded (real work belongs on dev).
          if git merge-base --is-ancestor HEAD "upstream/${TARGET_BRANCH}"; then
            git merge --ff-only "upstream/${TARGET_BRANCH}"
          else
            git reset --hard "upstream/${TARGET_BRANCH}"
          fi

      - name: Push synced unstable
        if: steps.sync.outputs.upstream != steps.sync.outputs.local
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/remotes/upstream/unstable:refs/heads/unstable" --force; then
              echo "Pushed unstable -> $(git rev-parse upstream/unstable)"
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::failed to push unstable after 3 attempts"
              exit 1
            fi
            sleep 10
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}