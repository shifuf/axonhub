name: Sync Upstream unstable

# Scheduled sync is intentionally disabled: GitHub disabled Actions on this
# repository and daily force-push automations on forks are a common
# abuse-detection trigger. Sync manually when needed via workflow_dispatch.
on:
  workflow_dispatch:

# The sync force-pushes the target branch, so it needs write access.
permissions:
  contents: write

jobs:
  sync:
    name: Sync upstream unstable with fork CI policy
    runs-on: ubuntu-latest
    # Safety guard: only run inside a fork, never on the upstream repository itself.
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Checkout unstable
        uses: actions/checkout@v4
        with:
          ref: unstable
          fetch-depth: 0
          persist-credentials: false

      - name: Sync upstream changes
        id: sync
        run: |
          set -euo pipefail

          git config user.name "axonhub-sync-bot"
          git config user.email "actions@users.noreply.github.com"

          UPSTREAM="https://github.com/looplj/axonhub.git"
          TARGET_BRANCH="unstable"

          # Keep the fork's post-sync policy script available even though the
          # target branch is reset to the upstream tree below.
          git fetch origin dev:refs/remotes/origin/dev --force
          git remote add upstream "$UPSTREAM"
          # Retry the fetch: transient GitHub-to-GitHub network hiccups were the
          # most common cause of the previous third-party action failing.
          for attempt in 1 2 3; do
            if git fetch upstream "${TARGET_BRANCH}" --tags --force; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::failed to fetch ${UPSTREAM} after 3 attempts"
              exit 1
            fi
            sleep 10
          done

          UPSTREAM_SHA="$(git rev-parse "upstream/${TARGET_BRANCH}")"
          LOCAL_SHA="$(git rev-parse HEAD)"
          echo "upstream=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "local=${LOCAL_SHA}" >> "$GITHUB_OUTPUT"

          if [ "$UPSTREAM_SHA" = "$LOCAL_SHA" ]; then
            echo "push_required=false" >> "$GITHUB_OUTPUT"
            echo "Already aligned with upstream at ${LOCAL_SHA}; post-sync policy will still be checked"
            exit 0
          fi

          PARENT_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          if [ "$PARENT_SHA" = "$UPSTREAM_SHA" ]; then
            echo "push_required=false" >> "$GITHUB_OUTPUT"
            echo "Already synced and fork policy is based on ${UPSTREAM_SHA}"
            exit 0
          fi

          # Sync upstream as usual; the dedicated fork CI-policy commit is reapplied
          # after this step. Other local-only unstable commits are discarded.
          if git merge-base --is-ancestor HEAD "upstream/${TARGET_BRANCH}"; then
            git merge --ff-only "upstream/${TARGET_BRANCH}"
          else
            git reset --hard "upstream/${TARGET_BRANCH}"
          fi
          echo "push_required=true" >> "$GITHUB_OUTPUT"

      - name: Disable test uploads after upstream sync
        id: sanitize
        run: |
          set -euo pipefail

          # Run the fork-owned policy script from dev against the freshly
          # synchronized unstable working tree. Tests stay enabled; only their
          # cache/artifact/summary uploads are disabled.
          git show origin/dev:scripts/ci/sanitize_test_workflows.py | \
            python3 - --repo-root "$GITHUB_WORKSPACE"

          if git diff --quiet -- .github/workflows/test.yml .github/workflows/docker-build.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add .github/workflows/test.yml .github/workflows/docker-build.yml
            git commit -m "ci: disable test uploads after upstream sync"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push synced and sanitized unstable
        if: steps.sync.outputs.push_required == 'true' || steps.sanitize.outputs.changed == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/unstable" --force; then
              echo "Pushed sanitized unstable -> $(git rev-parse HEAD)"
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::failed to push unstable after 3 attempts"
              exit 1
            fi
            sleep 10
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}