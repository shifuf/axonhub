name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: frontend

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Verify production dependency graphs
        run: |
          ./scripts/verify-go-sse-dependency-test.sh
          ./scripts/verify-go-sse-dependency.sh

      - name: Update VERSION file
        if: ${{ !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "Updating VERSION file to: $VERSION"
          echo "$VERSION" > internal/build/VERSION
          git add internal/build/VERSION

      - name: Commit VERSION file
        if: ${{ !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
        continue-on-error: true
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if VERSION files have changes
          if git diff --cached --quiet VERSION internal/build/VERSION; then
            echo "No changes to VERSION files"
          else
            # Commit VERSION files with [skip ci] to avoid triggering other workflows
            git commit -m "chore: update VERSION to ${GITHUB_REF#refs/tags/} [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

  docker-release:
    name: Publish domestic-ready image archive
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7

      - name: Stamp release version
        run: echo "${GITHUB_REF_NAME}" > internal/build/VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image name
        id: image
        run: |
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${REPO}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag "$IMAGE_NAME" \
            .
          docker push "$IMAGE_NAME"

      - name: Export image for mainland mirrors
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          VERSIONED="axonhub-${GITHUB_REF_NAME}-linux-amd64.tar.gz"
          LATEST="axonhub-linux-amd64.tar.gz"
          docker save "$IMAGE_NAME" | gzip -9 > "$VERSIONED"
          cp "$VERSIONED" "$LATEST"
          sha256sum "$VERSIONED" | awk '{print $1}' > "$VERSIONED.sha256"
          cp "$VERSIONED.sha256" "$LATEST.sha256"
          ls -lh "$VERSIONED" "$LATEST"

      - name: Upload image archive to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "axonhub-${GITHUB_REF_NAME}-linux-amd64.tar.gz" \
            "axonhub-${GITHUB_REF_NAME}-linux-amd64.tar.gz.sha256" \
            "axonhub-linux-amd64.tar.gz" \
            "axonhub-linux-amd64.tar.gz.sha256" \
            "deploy/axonhub-update.sh" \
            --clobber
